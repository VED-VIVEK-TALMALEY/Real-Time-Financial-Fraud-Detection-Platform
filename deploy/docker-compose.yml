services:
  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    ports: ["9092:9092"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db
    ports: ["5000:5000"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraud
      POSTGRES_PASSWORD: fraud
    ports: ["5432:5432"]
  api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    ports: ["8000:8000"]
  dashboard:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.dashboard
    ports: ["8501:8501"]
  consumer:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    command: ["python", "-m", "src.streaming.consumer"]
  producer:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    command: ["python", "-m", "src.streaming.producer", "--speed", "100"]
